[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beatsync"
version = "0.1.0"
description = "Two-source beat-synced video editor (Phase 1)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Antiarin" }]
dependencies = [
    "librosa>=0.11.0",
    "scipy>=1.13",
    "numpy>=2.0",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-mock>=3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-setuptools",
    "pre-commit>=4",
]

[project.scripts]
beatsync = "beatsync.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/beatsync"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "RUF", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["librosa.*", "scipy.*", "soundfile.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=beatsync",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.run]
source = ["src/beatsync"]
omit = ["src/beatsync/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
